<a href="../../projects/agada/">Back to Agada</a><h1>A space to experiment.</h1>
<p>This small page is independent of the notebook theme. Replace it with a browser experiment, or edit its HTML, CSS, and JavaScript as a first exercise.</p>
<button type="button" id="color">Change the background</button><p id="count" aria-live="polite">No changes yet.</p>
<script>const colors=['#172c35','#28213d','#17332e','#17191c'];let n=0;document.getElementById('color').addEventListener('click',()=>{document.body.style.background=colors[n%colors.length];n++;document.getElementById('count').textContent=`Background changed ${n} ${n===1?'time':'times'}.`;});</script></html>
